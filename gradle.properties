# Sized for an 8 GB machine that is also running Android Studio.
# The Gradle daemon, the Kotlin compile daemon and KSP each take their own JVM,
# so a large -Xmx here is what pushes the machine into swap and kills the build.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# One module, so parallel execution buys nothing and costs another JVM.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
